<section id="services" class="projects-section"><p class="eyebrow">03 / SELECTED BUILDS</p><div class="heading"><h2>Ideas made<br><span>interactive.</span></h2><p>Business templates, AI applications and experiments in creative technology.</p></div><div class="project-grid"><article class="project-card" *ngFor="let card of paginatedProjectData"><div class="project-image"><img [src]="card.imageURL" [alt]="card.name + ' project preview'" loading="lazy"></div><div class="project-body"><span class="category">{{card.category}}</span><h3>{{card.name}}</h3><p>{{card.details}}</p><div class="links"><a *ngIf="card.url && card.url !== '#'" [href]="card.url" target="_blank" rel="noopener noreferrer">Explore live ↗</a><a *ngIf="card.github" [href]="card.github" target="_blank" rel="noopener noreferrer">Source code ↗</a></div></div></article></div><nav class="pager" aria-label="Project pages"><button type="button" (click)="prevPage()" [disabled]="currentPage === 1">← Previous</button><span>{{currentPage}} / {{totalPages}}</span><button type="button" (click)="nextPage()" [disabled]="currentPage === totalPages">Next →</button></nav></section>
